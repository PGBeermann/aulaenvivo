###############################################################################
# Clase en Vivo UNACHI — configuración de MediaMTX
# Probada contra el esquema de MediaMTX v1.21.1 (versión que descarga
# servidor_clase.py). Las claves omitidas toman su valor por defecto.
#
# Modelo de seguridad:
#   - La señalización WHIP/WHEP sólo escucha en 127.0.0.1: navegadores y OBS
#     llegan a través de servidor_clase.py, que decide quién puede transmitir
#     (profesor: localhost en modo local, contraseña en modo online) y quién
#     puede ver (estudiantes, con código opcional en modo online).
#   - PUBLICAR sólo desde 127.0.0.1 / ::1 (es decir, a través del proxy).
#   - API de control sólo desde localhost.
#   - En modo online servidor_clase.py ajusta algunas claves con variables
#     MTX_* (IP pública anunciada, RTMP desactivado).
###############################################################################

logLevel: info
logDestinations: [stdout]

readTimeout: 10s
writeTimeout: 10s
# Cola de salida por espectador; 512 paquetes es suficiente para 720p/1080p.
writeQueueSize: 512

###############################################################################
# Autenticación
authMethod: internal
authInternalUsers:
  # Estudiantes: sólo lectura del salón "clase".
  - user: any
    pass:
    ips: []
    permissions:
      - action: read
        path: clase

  # Profesor: publicar y usar la API, sólo desde el mismo equipo.
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: publish
        path: clase
      - action: read
        path: clase
      - action: api
      - action: metrics

###############################################################################
# API de control (estado de la transmisión y número de espectadores)
api: true
apiAddress: 127.0.0.1:9997

metrics: false
pprof: false
playback: false

###############################################################################
# Protocolos no necesarios en el aula: se desactivan para reducir superficie
# de ataque y puertos abiertos.
rtsp: false
hls: false
srt: false
moq: false

# RTMP queda activo sólo como alternativa para OBS en modo RTMP
# (rtmp://localhost/clase). La publicación sigue limitada a localhost.
# En modo online se desactiva (MTX_RTMP=no).
rtmp: true
rtmpAddress: :1935

###############################################################################
# WebRTC — transporte principal (latencia < 1 s)
webrtc: true
# Señalización HTTP (WHIP/WHEP): sólo local; se accede por el puerto web
# (8080) a través de servidor_clase.py.
webrtcAddress: 127.0.0.1:8889
webrtcEncryption: false
webrtcAllowOrigins: ["*"]
# Medios — debe estar abierto en el firewall (UDP). En el VPS se publica
# este mismo puerto (PUERTO_MEDIOS) en UDP y TCP.
webrtcLocalUDPAddress: :8189
# Respaldo TCP para redes que filtran UDP entre clientes (mismo puerto, TCP).
webrtcLocalTCPAddress: :8189
# Anunciar las IP de las interfaces del equipo a los estudiantes.
webrtcIPsFromInterfaces: true
webrtcIPsFromInterfacesList: []
webrtcIPsFromInterfacesExcludeList: []
# servidor_clase.py no necesita esta lista; añada aquí la IP del profesor sólo
# si el equipo tiene adaptadores virtuales (VPN, Hyper-V, VirtualBox) y los
# estudiantes no logran conectar.  Ejemplo: ["192.168.1.50"]
webrtcAdditionalHosts: []
# No se requieren servidores STUN/TURN: en la LAN todos se ven entre sí y en
# el VPS el servidor anuncia su IP pública.
webrtcICEServers2: []
webrtcHandshakeTimeout: 10s
webrtcTrackGatherTimeout: 2s

###############################################################################
# Rutas: sólo existe el salón "clase"; cualquier otra ruta es rechazada.
pathDefaults:
  source: publisher
  # Si el profesor reinicia la transmisión, la nueva sesión reemplaza a la
  # anterior en lugar de ser rechazada.
  overridePublisher: true

paths:
  clase:
